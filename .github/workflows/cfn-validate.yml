# CloudFormation validation pipeline.
# Runs on every pull request to main (and on main itself) so that no template
# reaches main without passing both linters:
#   - cfn-lint : schema/property validation and AWS best-practice rules
#   - cfn-nag  : security-focused static analysis (IAM, encryption, network exposure)
# Policy: cfn-lint errors block the PR. cfn-nag is advisory (report-only): its
# findings are shown in the job log and the run summary but never block a merge.
# Intentional exceptions are suppressed in the templates with a written reason.
name: CloudFormation validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # allow a manual run from the Actions tab

# Least privilege for the workflow token: the jobs only read the repository.
permissions:
  contents: read

# Cancel an in-progress run when new commits are pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned version so results are reproducible between local runs and CI.
      - name: Install cfn-lint
        run: pip install "cfn-lint==1.58.0"

      # Reads .cfnlintrc.yaml (template list, region, ignored checks).
      # Only error-level findings fail the job; warnings are still printed.
      - name: Run cfn-lint
        run: cfn-lint --non-zero-exit-code error

  # The application tier source (three-tier/app/) is a real file, so it is
  # linted and format-checked like any other code. Instances run Amazon Linux
  # 2023's Python 3.9, so ruff targets that version.
  app-lint:
    name: app lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.6.9"

      - name: Lint
        run: ruff check --target-version py39 three-tier/app

      - name: Check formatting
        run: ruff format --check --target-version py39 three-tier/app

  cfn-nag:
    name: cfn-nag (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only: a cfn-nag failure is shown as a warning annotation on the run
    # but does not fail the workflow or block the pull request.
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install cfn-nag
        run: gem install cfn-nag --no-document

      # Scan each project separately and only *.yaml files, so parameter JSON
      # files and non-CloudFormation YAML (e.g. this workflow) are not parsed.
      # cfn_nag exits non-zero on FAILURES only; WARNINGS are reported.
      - name: Scan static-site templates
        run: cfn_nag_scan --input-path static-site --template-pattern '.*\.yaml$'

      - name: Scan three-tier templates
        run: cfn_nag_scan --input-path three-tier --template-pattern '.*\.yaml$'
