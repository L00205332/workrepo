AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Part A(b) - Three-tier architecture for L00205332.
  Web tier: internet-facing Application Load Balancer in public subnets.
  Application tier: EC2 Auto Scaling group (Python API + UI) in private subnets.
  Database tier: Amazon RDS for PostgreSQL in isolated subnets.
  Spans two Availability Zones. There is no NAT Gateway: private instances reach AWS
  services through VPC endpoints only, which saves cost and removes internet egress.

# ---------------------------------------------------------------------------
# Groups the parameters in the CloudFormation console for readability.
# ---------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Owner }
        Parameters: [StudentId, StudentName, EnvironmentName]
      - Label: { default: Network }
        Parameters: [VpcCidr, EnableSessionManager]
      - Label: { default: Application tier }
        Parameters: [InstanceType, LatestAmiId, MinSize, MaxSize, DesiredCapacity]
      - Label: { default: Database tier }
        Parameters: [DBInstanceClass, DBName, DBUsername, DBAllocatedStorage, DBMultiAZ]

Parameters:
  StudentId:
    Type: String
    Description: ATU student number (L-number), used in names, tags and the UI.
    Default: L00205332
    AllowedPattern: "^L[0-9]{8}$"
    ConstraintDescription: Must be an ATU L-number, e.g. L00205332.

  StudentName:
    Type: String
    Description: Full name shown in the application UI.
    Default: Mohamed Hanafi Sayed Khalifa Ismail
    MinLength: 1
    MaxLength: 100

  EnvironmentName:
    Type: String
    Description: Deployment environment, used in resource names and tags.
    Default: dev
    AllowedValues: [dev, test, prod]

  VpcCidr:
    Type: String
    Description: IPv4 CIDR block for the VPC. Six /24 subnets are carved out of it.
    Default: 10.0.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-4])$"
    ConstraintDescription: Must be a CIDR block between /16 and /24.

  EnableSessionManager:
    Type: String
    Description: >-
      Create the SSM VPC endpoints so instances can be reached with Session Manager
      (no SSH, no bastion host). Adds about $0.15/hour, so it is off by default.
    Default: "false"
    AllowedValues: ["true", "false"]

  InstanceType:
    Type: String
    Description: EC2 instance type for the application tier (Graviton/arm64).
    Default: t4g.micro
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Latest Amazon Linux 2023 arm64 AMI, resolved from the public SSM parameter.
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

  MinSize:
    Type: Number
    Description: Minimum number of application instances (2 = one per AZ).
    Default: 2
    MinValue: 1
    MaxValue: 4

  MaxSize:
    Type: Number
    Description: Maximum number of application instances when scaled out.
    Default: 4
    MinValue: 1
    MaxValue: 8

  DesiredCapacity:
    Type: Number
    Description: Starting number of application instances.
    Default: 2
    MinValue: 1
    MaxValue: 8

  DBInstanceClass:
    Type: String
    Description: RDS instance class for the database tier.
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]

  DBName:
    Type: String
    Description: Name of the application database.
    Default: appdb
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"

  DBUsername:
    Type: String
    Description: >-
      Master username. The password is generated and stored in AWS Secrets Manager
      by RDS, so it never appears in the template, parameters or console.
    Default: dbadmin
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,15}$"

  DBAllocatedStorage:
    Type: Number
    Description: Database storage in GiB.
    Default: 20
    MinValue: 20
    MaxValue: 100

  DBMultiAZ:
    Type: String
    Description: Run a synchronous standby database in the second AZ (doubles DB cost).
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  CreateSsmEndpoints: !Equals [!Ref EnableSessionManager, "true"]
  UseMultiAZ: !Equals [!Ref DBMultiAZ, "true"]

Resources:
  # =========================================================================
  # NETWORK: VPC across 2 AZs with one subnet per tier per AZ (6 subnets).
  #   public-a/b : web tier (ALB)          route to the Internet Gateway
  #   app-a/b    : application tier (EC2)  no internet route, VPC endpoints only
  #   db-a/b     : database tier (RDS)     no routes beyond the VPC at all
  # =========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true # required for interface endpoint private DNS
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- Subnets: !Cidr splits the VPC range into six /24 blocks -------------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: false # only the ALB lives here; nothing needs auto public IPs
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-public-a
        - Key: Tier
          Value: web

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-public-b
        - Key: Tier
          Value: web

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-app-a
        - Key: Tier
          Value: app

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-app-b
        - Key: Tier
          Value: app

  DBSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db-a
        - Key: Tier
          Value: db

  DBSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db-b
        - Key: Tier
          Value: db

  # --- Route tables ---------------------------------------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # App subnets: local VPC routes plus the S3 gateway endpoint route only.
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-app-rt

  AppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref AppRouteTable

  AppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref AppRouteTable

  # DB subnets: isolated, local VPC routes only.
  DBRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db-rt

  DBSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnetA
      RouteTableId: !Ref DBRouteTable

  DBSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnetB
      RouteTableId: !Ref DBRouteTable

  # =========================================================================
  # SECURITY GROUPS: each tier only accepts traffic from the tier in front.
  #   Internet -80-> ALB -8080-> App -5432-> DB
  # Cross-references use separate Ingress/Egress resources to avoid
  # circular dependencies between the groups.
  # =========================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web tier - public HTTP to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTP from the internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Forward to the application tier only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-alb-sg

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application tier - traffic from the ALB only
      VpcId: !Ref Vpc
      # Inline egress replaces the default allow-all rule. HTTPS is only usable
      # for VPC endpoints because the app subnets have no internet route.
      SecurityGroupEgress:
        - Description: HTTPS to VPC endpoints (S3, Secrets Manager, SSM)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-app-sg

  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      Description: App port from the load balancer
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  AppEgressToDatabase:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      Description: PostgreSQL to the database tier
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DBSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database tier - PostgreSQL from the application tier only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: PostgreSQL from the application tier
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      # The database never initiates connections; this rule matches nothing and
      # replaces the default allow-all egress rule.
      SecurityGroupEgress:
        - Description: No outbound traffic
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db-sg

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints - HTTPS from the application tier
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTPS from the application tier
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref AppSecurityGroup
      SecurityGroupEgress:
        - Description: No outbound traffic
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-endpoint-sg

  # =========================================================================
  # VPC ENDPOINTS: private access to AWS services instead of a NAT Gateway.
  # =========================================================================
  # Free gateway endpoint. Amazon Linux 2023 package repositories are hosted
  # in S3, so `dnf install` works without internet access.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref AppRouteTable

  # Lets the app read the database credentials from Secrets Manager.
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # Optional: Session Manager shell access without SSH keys or a bastion.
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpoints
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages
      PrivateDnsEnabled: true
      SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # =========================================================================
  # DATABASE TIER: RDS for PostgreSQL in the isolated DB subnets.
  # =========================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated subnets for the database tier
      SubnetIds: [!Ref DBSubnetA, !Ref DBSubnetB]
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db-subnets

  DBInstance:
    Type: AWS::RDS::DBInstance
    # Take a final snapshot on delete/replace so data is never lost by accident.
    # Remember to delete the snapshot after the lab to avoid storage charges.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "18" # major version only; RDS picks the current default minor
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      # RDS generates the password and stores (and rotates) it in Secrets Manager.
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true # encryption at rest with the AWS-managed KMS key
      MultiAZ: !If [UseMultiAZ, true, false]
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false # lab stack; set true for production
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db

  # =========================================================================
  # APPLICATION TIER: EC2 instances in an Auto Scaling group.
  # =========================================================================
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role for application tier instances.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager access (used only when the SSM endpoints are enabled).
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # Least privilege: read this one database secret and nothing else.
        - PolicyName: ReadDatabaseSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt DBInstance.MasterUserSecret.SecretArn

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppInstanceRole]

  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppInstanceProfile.Arn
        SecurityGroupIds: [!Ref AppSecurityGroup]
        # IMDSv2 only: protects instance credentials against SSRF attacks.
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub ${StudentId}-${EnvironmentName}-app-volume
        # Bootstraps the application: installs the PostgreSQL driver, writes the
        # app and its config, and runs it as a hardened systemd service.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail

            # PostgreSQL driver from the Amazon Linux repos (reached via the S3 endpoint).
            dnf install -y python3-psycopg2

            # Unprivileged service account; the app never runs as root.
            useradd --system --no-create-home --shell /sbin/nologin app || true
            mkdir -p /opt/app

            # Configuration injected by CloudFormation. No passwords are stored here.
            cat > /etc/app.env <<'ENVEOF'
            DB_HOST=${DBInstance.Endpoint.Address}
            DB_PORT=${DBInstance.Endpoint.Port}
            DB_NAME=${DBName}
            DB_SECRET_ARN=${DBInstance.MasterUserSecret.SecretArn}
            AWS_REGION=${AWS::Region}
            STUDENT_ID=${StudentId}
            STUDENT_NAME=${StudentName}
            HOME=/opt/app
            ENVEOF
            chmod 640 /etc/app.env
            chgrp app /etc/app.env

            cat > /opt/app/app.py <<'PYEOF'
            """Application tier for the three-tier demo.

            Serves a small UI at "/" (rendered by the browser) and a JSON API:
              GET /api/health  - liveness check for the load balancer (no DB call)
              GET /api/visits  - records a visit in PostgreSQL and returns the total
            """
            import html
            import json
            import os
            import subprocess
            import urllib.request
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

            DB_HOST = os.environ["DB_HOST"]
            DB_PORT = int(os.environ.get("DB_PORT", "5432"))
            DB_NAME = os.environ["DB_NAME"]
            DB_SECRET_ARN = os.environ["DB_SECRET_ARN"]
            REGION = os.environ["AWS_REGION"]
            STUDENT_ID = os.environ["STUDENT_ID"]
            STUDENT_NAME = os.environ["STUDENT_NAME"]

            _credentials = None
            _schema_ready = False


            def instance_metadata(path):
                """Read EC2 instance metadata using IMDSv2 (session token required)."""
                token_req = urllib.request.Request(
                    "http://169.254.169.254/latest/api/token",
                    method="PUT",
                    headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"},
                )
                token = urllib.request.urlopen(token_req, timeout=2).read().decode()
                req = urllib.request.Request(
                    "http://169.254.169.254/latest/meta-data/" + path,
                    headers={"X-aws-ec2-metadata-token": token},
                )
                return urllib.request.urlopen(req, timeout=2).read().decode()


            INSTANCE_ID = instance_metadata("instance-id")
            AVAILABILITY_ZONE = instance_metadata("placement/availability-zone")


            def get_credentials(refresh=False):
                """Fetch the DB username/password from Secrets Manager (cached)."""
                global _credentials
                if _credentials is None or refresh:
                    result = subprocess.run(
                        ["aws", "secretsmanager", "get-secret-value",
                         "--secret-id", DB_SECRET_ARN, "--region", REGION,
                         "--query", "SecretString", "--output", "text"],
                        check=True, capture_output=True, text=True, timeout=15,
                    )
                    _credentials = json.loads(result.stdout)
                return _credentials


            def connect():
                """Open a TLS connection to PostgreSQL.

                If login fails, the cached secret may be stale because RDS rotates
                it, so fetch it again and retry once.
                """
                import psycopg2  # lazy import: /api/health works even without the driver

                for attempt in range(2):
                    creds = get_credentials(refresh=attempt > 0)
                    try:
                        return psycopg2.connect(
                            host=DB_HOST, port=DB_PORT, dbname=DB_NAME,
                            user=creds["username"], password=creds["password"],
                            sslmode="require", connect_timeout=5,
                        )
                    except psycopg2.OperationalError:
                        if attempt == 1:
                            raise


            def record_visit():
                """Insert a visit row and return the total number of visits."""
                global _schema_ready
                conn = connect()
                try:
                    with conn, conn.cursor() as cur:  # commits on success
                        if not _schema_ready:
                            cur.execute(
                                "CREATE TABLE IF NOT EXISTS visits ("
                                " id SERIAL PRIMARY KEY,"
                                " served_by TEXT NOT NULL,"
                                " visited_at TIMESTAMPTZ NOT NULL DEFAULT now())"
                            )
                            _schema_ready = True
                        # Parameterised query: never build SQL from strings.
                        cur.execute("INSERT INTO visits (served_by) VALUES (%s)", (INSTANCE_ID,))
                        cur.execute("SELECT count(*) FROM visits")
                        return cur.fetchone()[0]
                finally:
                    conn.close()


            PAGE = """<!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>{sid} | Three-tier demo</title>
              <style>
                body {{ margin: 0; font-family: system-ui, sans-serif; background: #f7f9f9; color: #1d2b2a; }}
                header {{ background: #00594f; color: #fff; padding: 2rem 1rem; text-align: center; }}
                header h1 {{ margin: 0 0 .5rem; }}
                main {{ max-width: 760px; margin: 2rem auto; padding: 0 1rem; }}
                .tier {{ background: #fff; border-left: 4px solid #00594f; padding: .75rem 1rem; margin: .75rem 0; }}
                code {{ background: #e6eeed; padding: .1rem .35rem; border-radius: 4px; }}
              </style>
            </head>
            <body>
              <header>
                <h1>{sid} &ndash; {name}</h1>
                <p>Three-tier architecture on AWS, provisioned with CloudFormation</p>
              </header>
              <main>
                <div class="tier"><strong>Web tier:</strong> Application Load Balancer (public subnets)</div>
                <div class="tier"><strong>Application tier:</strong> EC2 <code>{iid}</code> in <code>{az}</code> (private subnet)</div>
                <div class="tier"><strong>Database tier:</strong> RDS PostgreSQL (isolated subnets)
                  &ndash; total visits: <strong id="visits">loading&hellip;</strong></div>
                <p>Refresh the page: the load balancer spreads requests across instances in both AZs.</p>
              </main>
              <script>
                fetch("/api/visits")
                  .then(function (r) {{ return r.json(); }})
                  .then(function (d) {{ document.getElementById("visits").textContent = d.visits !== undefined ? d.visits : d.error; }})
                  .catch(function () {{ document.getElementById("visits").textContent = "unavailable"; }});
              </script>
            </body>
            </html>
            """


            class Handler(BaseHTTPRequestHandler):
                def _send(self, status, body, content_type="application/json"):
                    data = body if isinstance(body, bytes) else json.dumps(body).encode()
                    self.send_response(status)
                    self.send_header("Content-Type", content_type)
                    self.send_header("Content-Length", str(len(data)))
                    self.send_header("Cache-Control", "no-store")
                    self.send_header("X-Content-Type-Options", "nosniff")
                    self.end_headers()
                    self.wfile.write(data)

                def do_GET(self):
                    if self.path == "/api/health":
                        self._send(200, {"status": "ok", "instance": INSTANCE_ID})
                    elif self.path == "/api/visits":
                        try:
                            self._send(200, {"visits": record_visit(),
                                             "served_by": INSTANCE_ID,
                                             "availability_zone": AVAILABILITY_ZONE})
                        except Exception as err:  # do not leak internals to the client
                            self.log_error("database error: %s", err)
                            self._send(503, {"error": "database unavailable"})
                    elif self.path == "/":
                        page = PAGE.format(sid=html.escape(STUDENT_ID), name=html.escape(STUDENT_NAME),
                                           iid=html.escape(INSTANCE_ID), az=html.escape(AVAILABILITY_ZONE))
                        self._send(200, page.encode(), "text/html; charset=utf-8")
                    else:
                        self._send(404, {"error": "not found"})


            if __name__ == "__main__":
                ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
            PYEOF

            # systemd unit with sandboxing options to limit what the process can do.
            cat > /etc/systemd/system/app.service <<'UNITEOF'
            [Unit]
            Description=Three-tier demo application
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=app
            Group=app
            EnvironmentFile=/etc/app.env
            ExecStart=/usr/bin/python3 /opt/app/app.py
            Restart=always
            RestartSec=5
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            UNITEOF

            systemctl daemon-reload
            systemctl enable --now app.service

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # Replace instances one at a time when the launch template changes, keeping
    # at least one instance serving traffic (zero-downtime updates).
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
    Properties:
      VPCZoneIdentifier: [!Ref AppSubnetA, !Ref AppSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs: [!Ref AppTargetGroup]
      # Replace instances that fail the load balancer health check, not just EC2 checks.
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-app
          PropagateAtLaunch: true
        - Key: Tier
          Value: app
          PropagateAtLaunch: true

  # Scalability: add/remove instances to keep average CPU around 50%.
  AppCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50

  # =========================================================================
  # WEB TIER: internet-facing Application Load Balancer.
  # =========================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        # Reject malformed headers (protects against HTTP request smuggling).
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-alb

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: instance
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Shorter drain time speeds up deployments for this small app.
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-app-tg

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

Outputs:
  ApplicationURL:
    Description: Public URL of the three-tier application (web tier entry point).
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}
  VpcId:
    Description: ID of the VPC.
    Value: !Ref Vpc
  DatabaseEndpoint:
    Description: Private endpoint of the RDS PostgreSQL instance.
    Value: !GetAtt DBInstance.Endpoint.Address
  DatabaseSecretArn:
    Description: Secrets Manager ARN holding the RDS master credentials.
    Value: !GetAtt DBInstance.MasterUserSecret.SecretArn
