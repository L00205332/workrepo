AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Part A(a) - Static website for L00205332. Content is stored in a private,
  encrypted S3 bucket and served publicly over HTTPS through Amazon CloudFront
  using Origin Access Control (OAC). A small Lambda-backed custom resource
  writes the web pages into the bucket at deploy time and empties the bucket on
  stack deletion, so the whole site is created and destroyed by one template.

# ---------------------------------------------------------------------------
# Parameters: values that change between deployments are not hard-coded.
# ---------------------------------------------------------------------------
Parameters:
  StudentName:
    Type: String
    Description: Full name shown in the website header.
    Default: Mohamed Hanafi Sayed Khalifa Ismail
    MinLength: 1
    MaxLength: 100

  StudentId:
    Type: String
    Description: ATU student number (L-number) shown in the website header.
    Default: L00205332
    AllowedPattern: "^L[0-9]{8}$"
    ConstraintDescription: Must be an ATU L-number, e.g. L00205332.

  EnvironmentName:
    Type: String
    Description: Deployment environment, used in resource names and tags.
    Default: dev
    AllowedValues: [dev, test, prod]

  PriceClass:
    Type: String
    Description: >-
      CloudFront edge locations to use. PriceClass_100 (North America and
      Europe) is the cheapest and suits an Ireland-based audience.
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

# ---------------------------------------------------------------------------
# Mappings: AWS-managed CloudFront policy IDs (fixed, global values).
# Using managed policies avoids re-implementing well-tested defaults.
# ---------------------------------------------------------------------------
Mappings:
  CloudFrontManagedPolicies:
    CachePolicy:
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
    ResponseHeadersPolicy:
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03

Resources:
  # -------------------------------------------------------------------------
  # Storage tier: private S3 bucket that holds the static web pages.
  # -------------------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    # Content is regenerated from this template, so the bucket is safe to delete.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # No BucketName: CloudFormation generates a globally unique name, which
      # avoids name collisions and allows the stack to be deployed many times.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256 # SSE-S3 encryption at rest
      # Block every form of public access; only CloudFront can read objects.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Disable ACLs entirely; access is controlled by the bucket policy only.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versioning keeps previous page versions so a bad deploy can be rolled back.
      VersioningConfiguration:
        Status: Enabled
      # Expire old versions after 30 days to keep storage costs down.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-website-content

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Least privilege: only THIS CloudFront distribution may read objects.
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # Reject any request that does not use TLS (encryption in transit).
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebsiteBucket.Arn
              - !Sub ${WebsiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # -------------------------------------------------------------------------
  # Public-facing web service: CloudFront CDN in front of the private bucket.
  # -------------------------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        Description: Lets CloudFront sign requests to the private S3 origin.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${StudentId} static website (${EnvironmentName})
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Origins:
          - Id: S3WebsiteOrigin
            # Regional endpoint avoids redirects while a new bucket's DNS propagates.
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # empty: OAC replaces the legacy OAI
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https # force HTTPS for visitors
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true # gzip/brotli for faster page loads
          CachePolicyId: !FindInMap [CloudFrontManagedPolicies, CachePolicy, CachingOptimized]
          # Adds HSTS, X-Content-Type-Options, X-Frame-Options, Referrer-Policy, etc.
          ResponseHeadersPolicyId: !FindInMap [CloudFrontManagedPolicies, ResponseHeadersPolicy, SecurityHeaders]
        # S3 returns 403 for missing keys when the bucket is private; show a
        # friendly error page with the correct 404 status instead.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /error.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /error.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-website-cdn

  # -------------------------------------------------------------------------
  # Content deployment: Lambda-backed custom resource.
  # CloudFormation cannot upload files to S3 by itself, so this function
  #   - Create/Update: writes the pages below into the bucket
  #   - Update:        invalidates the CloudFront cache so changes show at once
  #   - Delete:        empties the bucket (all versions) so it can be deleted
  # -------------------------------------------------------------------------
  ContentDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the website content deployer Lambda.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # Scoped to this bucket and this distribution only (least privilege).
        - PolicyName: WebsiteContentAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub ${WebsiteBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucketVersions
                Resource: !GetAtt WebsiteBucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  ContentDeployerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Writes static website content to S3 and empties the bucket on delete.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ContentDeployerRole.Arn
      Timeout: 120
      MemorySize: 128
      Code:
        ZipFile: |
          # cfnresponse is provided by AWS for inline (ZipFile) Lambda code.
          import time
          import boto3
          import cfnresponse

          s3 = boto3.client("s3")
          cloudfront = boto3.client("cloudfront")


          def empty_bucket(bucket):
              """Delete every object version and delete marker in the bucket."""
              paginator = s3.get_paginator("list_object_versions")
              for page in paginator.paginate(Bucket=bucket):
                  items = page.get("Versions", []) + page.get("DeleteMarkers", [])
                  objects = [{"Key": i["Key"], "VersionId": i["VersionId"]} for i in items]
                  if objects:
                      s3.delete_objects(Bucket=bucket, Delete={"Objects": objects, "Quiet": True})


          def upload_files(bucket, files):
              """Write each page to S3 with the correct Content-Type."""
              for f in files:
                  s3.put_object(
                      Bucket=bucket,
                      Key=f["Key"],
                      Body=f["Body"].encode("utf-8"),
                      ContentType=f["ContentType"],
                      CacheControl="public, max-age=300",
                  )


          def handler(event, context):
              props = event["ResourceProperties"]
              bucket = props["BucketName"]
              request = event["RequestType"]
              print(f"{request} request for bucket {bucket}")
              status = cfnresponse.SUCCESS
              reason = None
              try:
                  if request == "Delete":
                      empty_bucket(bucket)
                  else:
                      upload_files(bucket, props["Files"])
                      if request == "Update":
                          cloudfront.create_invalidation(
                              DistributionId=props["DistributionId"],
                              InvalidationBatch={
                                  "Paths": {"Quantity": 1, "Items": ["/*"]},
                                  "CallerReference": str(time.time()),
                              },
                          )
              except Exception as err:  # report the error back to CloudFormation
                  print(f"Error: {err}")
                  reason = str(err)
                  # Never block a stack delete; a non-empty bucket will surface its own error.
                  status = cfnresponse.SUCCESS if request == "Delete" else cfnresponse.FAILED
              # A fixed physical ID means updates never trigger a replace-and-delete.
              cfnresponse.send(event, context, status, {}, physicalResourceId=f"{bucket}-content", reason=reason)
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-content-deployer

  # Explicit log group so logs have a retention period instead of "never expire".
  ContentDeployerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ContentDeployerFunction}
      RetentionInDays: 14

  # The website pages. Editing any Body and redeploying updates the live site.
  # !Sub injects the student name and ID from the parameters into the HTML.
  WebsiteContent:
    Type: Custom::WebsiteContent
    DependsOn:
      - ContentDeployerLogGroup
      - WebsiteBucketPolicy
    Properties:
      ServiceToken: !GetAtt ContentDeployerFunction.Arn
      BucketName: !Ref WebsiteBucket
      DistributionId: !Ref Distribution
      Files:
        - Key: index.html
          ContentType: text/html; charset=utf-8
          Body: !Sub |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>${StudentId} | ${StudentName}</title>
              <link rel="stylesheet" href="/styles.css">
            </head>
            <body>
              <header>
                <h1>${StudentId} &ndash; ${StudentName}</h1>
                <p>ATU &middot; IaC for DevOps Pipelines &middot; CloudFormation Assignment</p>
              </header>
              <main>
                <section>
                  <h2>About this site</h2>
                  <p>This static website was provisioned entirely with AWS CloudFormation.
                     Its pages are stored in a private, encrypted Amazon S3 bucket and are
                     served worldwide over HTTPS by Amazon CloudFront.</p>
                </section>
                <section>
                  <h2>Deployment details</h2>
                  <ul>
                    <li>Stack: <code>${AWS::StackName}</code></li>
                    <li>Region: <code>${AWS::Region}</code></li>
                    <li>Environment: <code>${EnvironmentName}</code></li>
                  </ul>
                </section>
              </main>
              <footer>&copy; ${StudentName} (${StudentId})</footer>
            </body>
            </html>
        - Key: error.html
          ContentType: text/html; charset=utf-8
          Body: !Sub |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Page not found | ${StudentId}</title>
              <link rel="stylesheet" href="/styles.css">
            </head>
            <body>
              <header><h1>${StudentId} &ndash; ${StudentName}</h1></header>
              <main>
                <h2>404 &ndash; Page not found</h2>
                <p><a href="/">Back to the home page</a></p>
              </main>
            </body>
            </html>
        - Key: styles.css
          ContentType: text/css; charset=utf-8
          Body: |
            :root { --brand: #00594f; --bg: #f7f9f9; --text: #1d2b2a; }
            * { box-sizing: border-box; }
            body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
            header { background: var(--brand); color: #fff; padding: 2rem 1rem; text-align: center; }
            header h1 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 4vw, 2.2rem); }
            header p { margin: 0; opacity: .9; }
            main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
            code { background: #e6eeed; padding: .1rem .35rem; border-radius: 4px; }
            footer { text-align: center; padding: 1.5rem 1rem; font-size: .9rem; color: #5a6b69; }
            a { color: var(--brand); }

# ---------------------------------------------------------------------------
# Outputs: values needed to test and operate the site.
# ---------------------------------------------------------------------------
Outputs:
  WebsiteURL:
    Description: Public HTTPS URL of the website.
    Value: !Sub https://${Distribution.DomainName}
  BucketName:
    Description: S3 bucket that stores the website content.
    Value: !Ref WebsiteBucket
  DistributionId:
    Description: CloudFront distribution ID (for cache invalidations).
    Value: !Ref Distribution
