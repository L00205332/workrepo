AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Static site / storage module - private, encrypted, versioned S3 bucket that
  holds the website content. Read access is granted by the cdn module.

Parameters:
  StudentId:
    Type: String
    Description: ATU student number, used in tags.
  EnvironmentName:
    Type: String
    Description: Deployment environment, used in tags.

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    # Content is regenerated by the content module, so the bucket is safe to delete.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # No BucketName: CloudFormation generates a globally unique name, which
      # avoids name collisions and allows the stack to be deployed many times.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256 # SSE-S3 encryption at rest
      # Block every form of public access; only CloudFront can read objects.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Disable ACLs entirely; access is controlled by the bucket policy only.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versioning keeps previous page versions so a bad deploy can be rolled back.
      VersioningConfiguration:
        Status: Enabled
      # Expire old versions after 30 days to keep storage costs down.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-website-content

Outputs:
  BucketName:
    Description: Name of the website content bucket.
    Value: !Ref WebsiteBucket
  BucketArn:
    Description: ARN of the website content bucket.
    Value: !GetAtt WebsiteBucket.Arn
  BucketRegionalDomainName:
    Description: Regional endpoint used as the CloudFront origin.
    Value: !GetAtt WebsiteBucket.RegionalDomainName
