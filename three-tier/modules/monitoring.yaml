AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Three-tier / monitoring module - SNS email notifications driven by CloudWatch
  alarms on every tier (load balancer, application instances, database) and by
  RDS events such as Multi-AZ failovers.

Parameters:
  StudentId:
    Type: String
    Description: ATU student number, used in names and tags.
  EnvironmentName:
    Type: String
    Description: Deployment environment, used in names and tags.
  AlertEmail:
    Type: String
    Description: Email address that receives alarm notifications.
    NoEcho: true # personal data: masked in the console and API output
  LoadBalancerFullName:
    Type: String
    Description: ALB name in CloudWatch dimension format (from the loadbalancer module).
  TargetGroupFullName:
    Type: String
    Description: Target group name in CloudWatch dimension format (from the loadbalancer module).
  AutoScalingGroupName:
    Type: String
    Description: Application Auto Scaling group (from the compute module).
  DBInstanceId:
    Type: String
    Description: RDS instance identifier (from the database module).

Resources:
  # -------------------------------------------------------------------------
  # Notification channel
  # -------------------------------------------------------------------------
  # Not KMS-encrypted on purpose: CloudWatch alarms cannot publish to a topic
  # encrypted with the AWS-managed SNS key, and a customer-managed key would
  # add cost. Messages contain only alarm metadata, no application data.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W47
            reason: >-
              CloudWatch alarms cannot publish to a topic encrypted with the
              AWS-managed key; alarm messages contain no sensitive data.
    Properties:
      TopicName: !Sub ${StudentId}-${EnvironmentName}-alerts
      DisplayName: !Sub ${StudentId} ${EnvironmentName} alerts
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-alerts

  # AWS sends a confirmation email; alerts are delivered once it is confirmed.
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # -------------------------------------------------------------------------
  # Web tier alarms (Application Load Balancer)
  # -------------------------------------------------------------------------
  # Errors generated by the load balancer itself, e.g. 503 when no healthy targets.
  AlbElb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-alb-elb-5xx
      AlarmDescription: The load balancer returned 10 or more 5xx errors in 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching # no traffic means no errors
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Errors returned by the application, e.g. 503 "database unavailable".
  AlbTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-alb-target-5xx
      AlarmDescription: The application returned 10 or more 5xx errors in 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # At least one instance is failing the /api/health check for 2 minutes.
  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-unhealthy-hosts
      AlarmDescription: One or more application instances failed the load balancer health check.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Performance: average response time above 1 second for 5 minutes.
  SlowResponsesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-slow-responses
      AlarmDescription: Average target response time exceeded 1 second for 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # -------------------------------------------------------------------------
  # Application tier alarm (Auto Scaling group)
  # -------------------------------------------------------------------------
  # Scaling targets 50% CPU; staying above 80% means scaling is not keeping up
  # (e.g. MaxSize reached).
  AppCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-app-cpu-high
      AlarmDescription: Application instances averaged above 80% CPU for 10 minutes.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroupName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # -------------------------------------------------------------------------
  # Database tier alarms (RDS)
  # -------------------------------------------------------------------------
  DbCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-db-cpu-high
      AlarmDescription: Database CPU above 80% for 10 minutes.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Running out of storage stops writes; 2 GiB left of 20 GiB is the warning point.
  DbFreeStorageLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-db-storage-low
      AlarmDescription: Database free storage below 2 GiB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceId
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648 # bytes (2 GiB)
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # db.t4g.micro has 1 GiB of RAM; below 100 MiB the database starts swapping.
  DbFreeMemoryLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-db-memory-low
      AlarmDescription: Database freeable memory below 100 MiB for 10 minutes.
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 104857600 # bytes (100 MiB)
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # The app opens one connection per request; a high count signals a leak or
  # a traffic spike approaching the small instance's connection limit.
  DbConnectionsHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${StudentId}-${EnvironmentName}-db-connections-high
      AlarmDescription: More than 60 database connections for 10 minutes.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstanceId
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # RDS events (not metrics): emails when a Multi-AZ failover, outage or
  # low-storage event happens on the database instance.
  DbEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      SubscriptionName: !Sub ${StudentId}-${EnvironmentName}-db-events
      SnsTopicArn: !Ref AlertsTopic
      SourceType: db-instance
      SourceIds: [!Ref DBInstanceId]
      EventCategories:
        - failover
        - failure
        - availability
        - low storage
      Enabled: true

Outputs:
  AlertsTopicArn:
    Description: SNS topic that receives all alarm and RDS event notifications.
    Value: !Ref AlertsTopic
