AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Three-tier / compute module (application tier) - EC2 Auto Scaling group in
  the private app subnets running the Python UI and API, registered with the
  load balancer target group.

Parameters:
  StudentId:
    Type: String
    Description: ATU student number, used in names and tags.
  EnvironmentName:
    Type: String
    Description: Deployment environment, used in names and tags.
  StudentName:
    Type: String
    Description: Full name shown in the application UI.
  AppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private application subnets (from the networking module).
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Application security group (from the networking module).
  TargetGroupArn:
    Type: String
    Description: Load balancer target group (from the loadbalancer module).
  InstanceType:
    Type: String
    Description: EC2 instance type (Graviton/arm64).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Latest Amazon Linux 2023 arm64 AMI, resolved from the public SSM parameter.
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  MinSize:
    Type: Number
    Description: Minimum number of application instances.
  MaxSize:
    Type: Number
    Description: Maximum number of application instances.
  DesiredCapacity:
    Type: Number
    Description: Starting number of application instances.
  DBEndpointAddress:
    Type: String
    Description: Database endpoint (from the database module).
  DBEndpointPort:
    Type: String
    Description: Database port (from the database module).
  DBName:
    Type: String
    Description: Name of the application database.
  DBSecretArn:
    Type: String
    Description: Secrets Manager ARN of the DB credentials (from the database module).
  ArtifactsBucketName:
    Type: String
    Description: S3 bucket holding the application releases (three-tier/app/<version>/).
  AppVersion:
    Type: String
    Description: Application release to install, e.g. 1.0.0 (S3 prefix three-tier/app/<version>/).

Resources:
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role for application tier instances.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager access (used only when the SSM endpoints are enabled).
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # Least privilege: read this one database secret and nothing else.
        - PolicyName: ReadDatabaseSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBSecretArn
        # Least privilege: download only the files of the release being installed.
        - PolicyName: ReadApplicationRelease
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactsBucketName}/three-tier/app/${AppVersion}/*


  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppInstanceRole]


  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppInstanceProfile.Arn
        SecurityGroupIds: [!Ref AppSecurityGroupId]
        # IMDSv2 only: protects instance credentials against SSRF attacks.
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub ${StudentId}-${EnvironmentName}-app-volume
        # Bootstraps the instance: installs the PostgreSQL driver, downloads the
        # versioned application release from the artifacts bucket, writes the
        # runtime config and starts the app as a hardened systemd service.
        # The app source lives in three-tier/app/ in the repository, not here.
        # AppVersion appears in this script, so bumping it creates a new launch
        # template version and triggers a rolling replacement of the instances.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail

            # Release being installed: ${AppVersion}

            # PostgreSQL driver from the Amazon Linux repos (reached via the S3 endpoint).
            dnf install -y python3-psycopg2

            # Unprivileged service account; the app never runs as root.
            useradd --system --no-create-home --shell /sbin/nologin app || true
            mkdir -p /opt/app

            # Download the release (S3 gateway endpoint; no internet access needed).
            aws s3 cp --region ${AWS::Region} s3://${ArtifactsBucketName}/three-tier/app/${AppVersion}/app.py /opt/app/app.py
            aws s3 cp --region ${AWS::Region} s3://${ArtifactsBucketName}/three-tier/app/${AppVersion}/app.service /etc/systemd/system/app.service
            chmod 644 /opt/app/app.py /etc/systemd/system/app.service

            # Configuration injected by CloudFormation. No passwords are stored here.
            cat > /etc/app.env <<'ENVEOF'
            DB_HOST=${DBEndpointAddress}
            DB_PORT=${DBEndpointPort}
            DB_NAME=${DBName}
            DB_SECRET_ARN=${DBSecretArn}
            AWS_REGION=${AWS::Region}
            STUDENT_ID=${StudentId}
            STUDENT_NAME=${StudentName}
            APP_VERSION=${AppVersion}
            HOME=/opt/app
            ENVEOF
            chmod 640 /etc/app.env
            chgrp app /etc/app.env

            systemctl daemon-reload
            systemctl enable --now app.service


  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # Replace instances one at a time when the launch template changes, keeping
    # at least one instance serving traffic (zero-downtime updates).
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
    Properties:
      VPCZoneIdentifier: !Ref AppSubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs: [!Ref TargetGroupArn]
      # Replace instances that fail the load balancer health check, not just EC2 checks.
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-app
          PropagateAtLaunch: true
        - Key: Tier
          Value: app
          PropagateAtLaunch: true


  # Scalability: add/remove instances to keep average CPU around 50%.
  AppCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50

Outputs:
  AutoScalingGroupName:
    Description: Name of the application Auto Scaling group.
    Value: !Ref AppAutoScalingGroup
