AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Three-tier / database module - Amazon RDS for PostgreSQL in the isolated DB
  subnets. The master password is generated by RDS and kept in Secrets Manager.

Parameters:
  StudentId:
    Type: String
    Description: ATU student number, used in names and tags.
  EnvironmentName:
    Type: String
    Description: Deployment environment, used in names and tags.
  DBSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Isolated database subnets (from the networking module).
  DBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Database security group (from the networking module).
  DBInstanceClass:
    Type: String
    Description: RDS instance class.
  DBName:
    Type: String
    Description: Name of the application database.
  DBUsername:
    Type: String
    Description: Master username (the password is managed by RDS).
    # NoEcho masks the value in the console, API output and events, so the
    # username is not exposed alongside the endpoint (cfn-nag F24).
    NoEcho: true
  DBAllocatedStorage:
    Type: Number
    Description: Database storage in GiB.
  DBMultiAZ:
    Type: String
    Description: Run a synchronous standby database in the second AZ.
    AllowedValues: ["true", "false"]

Conditions:
  UseMultiAZ: !Equals [!Ref DBMultiAZ, "true"]

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated subnets for the database tier
      SubnetIds: !Ref DBSubnetIds
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db-subnets


  DBInstance:
    Type: AWS::RDS::DBInstance
    # Take a final snapshot on delete/replace so data is never lost by accident.
    # Remember to delete the snapshot after the lab to avoid storage charges.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F80
            reason: >-
              Deletion protection is off on purpose: this is a lab stack that must be
              destroyed after every session to stay within the free-tier budget.
              Data is still protected by DeletionPolicy Snapshot.
    Properties:
      Engine: postgres
      EngineVersion: "18" # major version only; RDS picks the current default minor
      DBInstanceClass: !Ref DBInstanceClass
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      # RDS generates the password and stores (and rotates) it in Secrets Manager.
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true # encryption at rest with the AWS-managed KMS key
      # High availability: RDS keeps a synchronous standby replica in the other
      # Availability Zone. On failure (or a forced failover) it promotes the
      # standby and repoints the endpoint DNS name, so the application keeps
      # using the same endpoint and only needs to reconnect.
      MultiAZ: !If [UseMultiAZ, true, false]
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroupId]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      # Off-peak windows (UTC) that do not overlap. With Multi-AZ, maintenance
      # is applied to the standby first and then fails over, minimising downtime.
      PreferredBackupWindow: "02:00-03:00"
      PreferredMaintenanceWindow: "sun:03:30-sun:04:30"
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false # lab stack; set true for production
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-${EnvironmentName}-db

Outputs:
  DBEndpointAddress:
    Description: Private endpoint of the RDS instance.
    Value: !GetAtt DBInstance.Endpoint.Address
  DBEndpointPort:
    Description: Port of the RDS instance.
    Value: !GetAtt DBInstance.Endpoint.Port
  DBSecretArn:
    Description: Secrets Manager ARN holding the master credentials.
    Value: !GetAtt DBInstance.MasterUserSecret.SecretArn
  DBInstanceId:
    Description: RDS instance identifier (used for failover tests and monitoring).
    Value: !Ref DBInstance
